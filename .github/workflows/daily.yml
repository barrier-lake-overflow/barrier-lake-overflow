# 每日自動更新（雲端）。設定步驟見 docs/daily.md「GitHub Actions」。
# 需要的 Secrets：GEE_SERVICE_ACCOUNT_KEY（服務帳號金鑰 JSON 全文）、GEE_PROJECT。
name: daily-update

on:
  schedule:
    # 每兩天 07:17（台灣時間），UTC 的單數日 23:17。月底 31 日與隔月 1 日會連續跑兩天（cron 的 */2 依日期計算）。
    # GitHub 排程在整點、半點最擁擠，容易延遲或被跳過，所以避開。排程不保證準時，延遲數十分鐘屬正常；
    # repo 轉移後要重新 push 本檔才會重新登記排程。急著更新時到 Actions 頁面手動 Run workflow。
    - cron: "17 23 */2 * *"
  workflow_dispatch:         # 也可以在 Actions 頁面手動執行

permissions:
  contents: write            # 要把結果 commit 回 repo

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-daily.txt
      - run: pip install -r requirements-daily.txt
      - name: Run daily update
        working-directory: code
        env:
          GEE_SERVICE_ACCOUNT_KEY: ${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}
          GEE_PROJECT: ${{ secrets.GEE_PROJECT }}
          PYTHONIOENCODING: utf-8
        run: |
          git config user.name "daily-update[bot]"
          git config user.email "daily-update@users.noreply.github.com"
          python -m pipeline.daily.run --commit --push
